[pytest]
# Pytest configuration for Smart Todo Backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Add options
addopts =
    -ra
    -v
    --strict-markers
    --strict-config
    --showlocals

# Test paths
testpaths = tests

# Async support
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with database)
    slow: Slow running tests

# Coverage (optional)
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=html --cov-report=term
